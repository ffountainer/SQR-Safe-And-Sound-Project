name: testing

on:
  push:
  pull_request:

jobs:
  test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      run: pip install poetry
    
    - name: Install dependencies 
      run: poetry install --not-root
    
    - name: Dependency Validation 
      run: poetry check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Cyclomatic Complexity
        run: radon cc src/ -a -s
      
      - name: Maintainability Index
        if: '!cancelled()'
        run: radon mi src/ -s
      
      - name: Style (PEP8)
        if: '!cancelled()'
        run: flake8 src/ tests/
      
      - name: Unit Tests Pass Rate
        if: '!cancelled()'
        run: pytest
      
      - name: Line Coverage
        if: '!cancelled()'
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=70
      
      - name: Security Scan
        if: '!cancelled()'
        run: bandit -r src/ -ll
      
      - name: Performance Smoke Test
        if: '!cancelled()'
        run: locust -f tests/load/locustfile.py --headless -u 1 -r 1 -t 10s